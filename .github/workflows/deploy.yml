name: Deploy AI service

# Everything happens in the "production" environment, which waits for
# approval: build the image, smoke-test that exact image, push it, deploy it.
# Azure trusts only that environment (OIDC), so no Azure password is stored here.

on:
  push:
    branches: [master]
    paths:
      - "app.py"
      - "predict.py"
      - "feature_extractor.py"
      - "models/**"
      - "requirements.txt"
      - "Dockerfile"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, test and push the image only; do not update the running app"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-ai
  cancel-in-progress: false

env:
  REGISTRY: xnewsbackendacr.azurecr.io
  IMAGE: xnewsbackendacr.azurecr.io/xnews-ai
  APP: xnews-ai
  RESOURCE_GROUP: xnews-rg

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t "$IMAGE:${{ steps.tag.outputs.tag }}" .

      - name: Smoke-test the built image
        run: |
          docker run -d --name ai -p 8000:8000 -e AI_SERVICE_API_KEY=ci-dummy-key "$IMAGE:${{ steps.tag.outputs.tag }}"
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          AI_SERVICE_API_KEY=ci-dummy-key python3 smoke_test.py http://127.0.0.1:8000

      - name: Container log
        if: failure()
        run: docker logs ai || true

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push image
        run: |
          az acr login --name "${REGISTRY%%.*}"
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"

      - name: Update the container app
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          az containerapp update --name "$APP" --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE:${{ steps.tag.outputs.tag }}" --output none

      - name: Check the new revision is live
        if: github.event_name == 'push' || inputs.dry_run == false
        run: |
          expected="$IMAGE:${{ steps.tag.outputs.tag }}"
          fqdn=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          for i in $(seq 1 36); do
            image=$(az containerapp show -n "$APP" -g "$RESOURCE_GROUP" --query "properties.template.containers[0].image" -o tsv)
            health=$(curl -s -o /dev/null -w "%{http_code}" "https://$fqdn/health" || true)
            nokey=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Content-Type: application/json" -d '{"text":"x"}' "https://$fqdn/embed" || true)
            echo "attempt $i: image=$image health=$health embed-without-key=$nokey"
            if [ "$image" = "$expected" ] && [ "$health" = "200" ] && { [ "$nokey" = "401" ] || [ "$nokey" = "422" ]; }; then
              echo "AI service is live on $expected"
              exit 0
            fi
            sleep 10
          done
          echo "AI service did not come up on $expected within 6 minutes"
          exit 1
